name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Publish download link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kesher.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk kesher.apk --title "קשר – אפליקציה לאנדרואיד" --notes "גרסה ${{ github.run_number }}" --latest

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          cp android/build.log /tmp/build.log 2>/dev/null || echo "no build log" > /tmp/build.log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs
